<!DOCTYPE html>
<html lang="en">
    <head>
        
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <link rel="stylesheet" href="css/estilo.css" />
    </head>
    <body>
        <header>
            <h1>Mi primera WEB de Lenguajes de marcas</h1>
                        
            <h2>Menu:</h2>
            <fieldset> 
                <nav>
                    <a href="index.html">Inicio</a>
                    <a href="horario.html">Horario</a>
                    <a href="formulario.html">Formulario</a>
                </nav>
            </fieldset>
        </header>
        <main>
            
            <fieldset>
                <h2>Formulario de contacto</h2>
            </fieldset>
                    
            <form> 
                <fieldset>
                    <P>
                        <h3>Información personal</h3>
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" placeholder="escribe tu nombre"required><br><br>
                    </P>
                    <p> 
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required><br><br>
                    </p>
                    <p>
                        <label for="telefono">Teléfono:</label>
                        <input type="tel" id="telefono" name="telefono" required><br><br>
                    </p>

                    <p>
                        <label for="pagina-web">Página web:</label>
                        <input type="url" id="pagina-web" name="pagina-web" required><br><br>
                    </p>
                    <p>
                        <label for="buscar">Buscar:</label>  
                        <input type="email" id="buscar" name="email" required><br><br>
                    </p>
                    <p> 
                        <label for="mensaje">Mensaje:</label><br>
                        <textarea id="mensaje" name="mensaje" rows="4" cols="50" required></textarea><br><br>
                    </p>

                    <p>
                        <input type="submit" value="Enviar">
                    </p>

                    
                </fieldset>
                <fieldset>  
                
                    <p>
                        <legend>Fecha y hora</legend>
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" name="fecha" required><br><br>
                    </p>

                    <p>
                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" name="hora" required><br><br>
                    </p>

                    <p>
                        <label for="fechahora">Fecha y hora:</label>
                        <input type="datetime-local" id="fechahora" name="fecha y hora" required><br><br>
                    </p>
                    
                    <p>
                        <label for="semana">Semana:</label>
                        <input type="week" id="semana" name="semana" required><br><br>
                    </p>

                    <p>
                        <label for="mes">Mes:</label>
                    <input type="month" id="mes" name="mes" required><br><br>   
                    </p>

                </fieldset>

                <fieldset>
                    <p>
                        <legend>
                            <input type="reset" value="Limpiar">
                        </legend>
                    </p>
                   
                </fieldset>
            </form>
            


        </main>

        <footer>

        </footer>
        
        
        
        
    </body>
</html>
